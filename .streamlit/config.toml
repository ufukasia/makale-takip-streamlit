[theme]
base = "dark"
primaryColor = "#00f0ff"
backgroundColor = "#07070f"
secondaryBackgroundColor = "#101022"
textColor = "#d7f9ff"
font = "sans serif"

# Streamlit Cloud'da onboarding sorusunda takılıp sunucunun hiç baslamamasini
# (healthz connection refused) onlemek icin headless acik olmali.
# Yerelde de bu ayarla calisir; tarayiciyi kendin ac: http://localhost:8501
[server]
headless = true

[browser]
gatherUsageStats = false
